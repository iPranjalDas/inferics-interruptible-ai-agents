<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AGENT OS · Samsung Theme 05</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap');
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      overflow: hidden;
    }
    
    /* 3D Mesh Background Elements */
    .mesh-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      perspective: 2000px;
    }
    .orb-1 {
      position: absolute;
      top: -30%; left: -10%;
      width: 80vw; height: 80vw;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.15);
      filter: blur(150px);
      animation: pulse 8s infinite alternate;
    }
    .orb-2 {
      position: absolute;
      bottom: -30%; right: -10%;
      width: 70vw; height: 70vw;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.15);
      filter: blur(150px);
      animation: pulse 12s infinite alternate-reverse;
    }
    .grid-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60vh;
      background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PXBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0wIDEwaDQwTTEwIDB2NDAiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9zdmc+");
      transform: rotateX(75deg) scale(3) translateY(20%);
      transform-origin: bottom;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="mesh-bg">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="grid-floor"></div>
  </div>

  <div id="root"></div>

  <!-- Compiled React App -->
  <script src="./app.bundle.js"></script>
</body>
</html>
